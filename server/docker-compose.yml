services:
  flowtrace:
    container_name: flowtrace-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7292:8000"
    volumes:
      - ../data:/app/data
      - ./static:/app/static:ro
      - ./detection.py:/app/detection.py:ro
      - ./manage_cli.py:/app/manage_cli.py:ro
    environment:
      - DATABASE_PATH=/app/data/flowtrace.db
      - CONFIG_PATH=/app/config.json
      - API_KEY=${API_KEY:-}
    restart: always
